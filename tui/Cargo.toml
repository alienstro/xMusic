[package]
name = "xmusic-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal client for the xmusic-player daemon"

# The command people actually type. The crate stays xmusic-tui so the two halves
# of the workspace still read as a pair.
[[bin]]
name = "xmusic"
path = "src/main.rs"

[dependencies]
xmusic-protocol.workspace = true
ratatui = "0.29"
crossterm = "0.28"
ureq = { version = "2", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

# Reading a YouTube session out of a Chromium browser. See src/cookies.rs.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

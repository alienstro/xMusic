[workspace]
resolver = "2"
members = ["protocol", "player", "tui"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
xmusic-protocol = { path = "protocol" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
